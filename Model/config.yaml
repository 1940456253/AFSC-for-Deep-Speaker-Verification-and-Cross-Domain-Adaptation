# Source-domain AFSC + ECAPA recipe. See README for legacy-code differences.
feature: afsc
sample_rate: 16000
crop_seconds: 3.0
embedding_dim: 192
channels: [1024, 1024, 1024, 1024, 3072]
seed: 1234
batch_size: 16
num_workers: 4
joint_epochs: 2
frozen_epochs: 8
learning_rate: 0.05
min_learning_rate: 0.00005
warmup_epochs: 5
gap_lr_multiplier: 30.0
momentum: 0.9
weight_decay: 0.0001
scale: 32.0
margin: 0.3
# constant follows the paper's stated margin. ramp follows the supplied log.
margin_schedule: constant
margin_start_epoch: 4
margin_end_epoch: 8
reset_optimizer_at_freeze: true
log_every: 100
