# Tiny synthetic pipeline test ONLY. This is not the paper architecture/recipe.
feature: afsc
sample_rate: 16000
crop_seconds: 0.5
embedding_dim: 24
channels: [32, 32, 32, 32, 96]
seed: 1234
batch_size: 4
num_workers: 0
joint_epochs: 1
frozen_epochs: 1
learning_rate: 0.001
min_learning_rate: 0.00001
warmup_epochs: 0
gap_lr_multiplier: 30.0
momentum: 0.9
weight_decay: 0.0001
scale: 32.0
margin: 0.3
margin_schedule: constant
margin_start_epoch: 0
margin_end_epoch: 1
reset_optimizer_at_freeze: true
log_every: 1
